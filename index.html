<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家計簿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- ===== ボトムナビ ===== -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-screen="home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">ホーム</span>
  </button>
  <button class="nav-item" data-screen="list">
    <span class="nav-icon">📋</span>
    <span class="nav-label">明細</span>
  </button>
  <button class="nav-item" data-screen="analysis">
    <span class="nav-icon">📊</span>
    <span class="nav-label">分析</span>
  </button>
  <button class="nav-item" data-screen="settle">
    <span class="nav-icon">🤝</span>
    <span class="nav-label">精算</span>
  </button>
  <button class="nav-item" data-screen="subscription">
    <span class="nav-icon">🔁</span>
    <span class="nav-label">サブスク</span>
  </button>
</nav>

<!-- ===== 画面コンテナ ===== -->
<div id="app">

  <!-- ホーム -->
  <div id="screen-home" class="screen active">
    <div class="screen-header">
      <span class="app-title">💰 家計簿</span>
      <div class="month-nav">
        <button class="month-btn" id="prevMonth">‹</button>
        <span id="homeMonthLabel" class="month-label"></span>
        <button class="month-btn" id="nextMonth">›</button>
      </div>
    </div>
    <div class="viewer-switch" id="homeViewerSwitch">
      <button class="viewer-chip active" data-viewer="all">全体</button>
      <button class="viewer-chip" data-viewer="keisuke">慶佑</button>
      <button class="viewer-chip" data-viewer="nene">寧子</button>
    </div>
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">支出</div>
        <div class="summary-amount expense" id="homeTotalExpense">¥0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">収入</div>
        <div class="summary-amount income" id="homeTotalIncome">¥0</div>
      </div>
      <div class="summary-card wide">
        <div>
          <div class="summary-label">収支バランス</div>
          <div class="summary-amount balance" id="homeTotalBalance">¥0</div>
        </div>
      </div>
    </div>
    <div class="section-title">直近の記録</div>
    <div id="homeRecentList" class="entry-list"></div>
    <button class="fab" id="fabBtn">+</button>
  </div>

  <!-- 明細 -->
  <div id="screen-list" class="screen">
    <div class="screen-header">
      <span class="screen-title">明細</span>
      <div class="month-nav">
        <button class="month-btn" id="listPrevMonth">‹</button>
        <span id="listMonthLabel" class="month-label"></span>
        <button class="month-btn" id="listNextMonth">›</button>
      </div>
    </div>
    <div class="viewer-switch" id="listViewerSwitch">
      <button class="viewer-chip active" data-viewer="all">全体</button>
      <button class="viewer-chip" data-viewer="keisuke">慶佑</button>
      <button class="viewer-chip" data-viewer="nene">寧子</button>
    </div>
    <div id="listPanel" class="entry-list padded"></div>
  </div>

  <!-- 分析 -->
  <div id="screen-analysis" class="screen">
    <div class="screen-header">
      <span class="screen-title">分析</span>
      <div class="month-nav">
        <button class="month-btn" id="analysisPrevMonth">‹</button>
        <span id="analysisMonthLabel" class="month-label"></span>
        <button class="month-btn" id="analysisNextMonth">›</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="cat">カテゴリ別</button>
      <button class="tab" data-tab="payment">支払方法別CF</button>
      <button class="tab" data-tab="report">月次レポート</button>
    </div>
    <div id="tab-cat" class="tab-panel active">
      <div class="chart-section">
        <div class="chart-title">カテゴリ別支出</div>
        <div id="catBars" class="cat-bars"></div>
      </div>
    </div>
    <div id="tab-payment" class="tab-panel">
      <div class="chart-section">
        <div class="chart-title">支払方法別キャッシュフロー</div>
        <div id="paymentCFList" class="payment-list"></div>
      </div>
    </div>
    <div id="tab-report" class="tab-panel">
      <div class="chart-section">
        <div class="report-header">
          <div class="chart-title">AI月次レポート</div>
          <button class="btn-outline" id="generateReportBtn">✨ 生成する</button>
        </div>
        <div id="reportContent" class="report-content">
          <div class="empty-state">
            <div class="empty-icon">📄</div>
            <div class="empty-text">「生成する」を押してAIレポートを作成します</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 精算 -->
  <div id="screen-settle" class="screen">
    <div class="screen-header">
      <span class="screen-title">精算</span>
      <button class="header-btn" id="addSplitBtn">＋ 記録</button>
    </div>
    <div class="section-title">負債ダッシュボード</div>
    <div id="debtDashboard" class="debt-dashboard"></div>
    <div class="section-title" style="margin-top:16px">割り勘・立替一覧</div>
    <div id="splitList" class="split-list padded"></div>
  </div>

  <!-- サブスク -->
  <div id="screen-subscription" class="screen">
    <div class="screen-header">
      <span class="screen-title">サブスク管理</span>
      <button class="header-btn" id="addSubBtn">＋ 追加</button>
    </div>
    <div class="section-title">登録済みサブスク</div>
    <div id="subList" class="sub-list padded"></div>
  </div>

</div><!-- /#app -->

<!-- ===== モーダル：収支入力 ===== -->
<div class="overlay" id="entryOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">記録を追加</span>
      <button class="modal-close" id="entryOverlayClose">×</button>
    </div>
    <div class="form-group">
      <div class="toggle-row">
        <button class="toggle-btn active expense" id="btnExpense">支出</button>
        <button class="toggle-btn income" id="btnIncome">収入</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">金額（円）</label>
      <input class="form-input amount-input" id="inputAmount" type="number" inputmode="decimal" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">内容・メモ</label>
      <input class="form-input" id="inputMemo" type="text" placeholder="例：ランチ、スーパー">
    </div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" id="inputDate" type="date">
    </div>
    <div class="form-group" id="catSection">
      <label class="form-label">カテゴリ</label>
      <div class="chip-grid" id="catGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">支払い方法</label>
      <div class="chip-grid-2" id="payGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">支払者</label>
      <div class="chip-grid-2" id="payerGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">割り勘</label>

      <div class="toggle-row">
        <button class="toggle-btn active" id="splitNoBtn">
          しない
        </button>

        <button class="toggle-btn" id="splitYesBtn">
          する
        </button>
      </div>
    </div>
    <div
      class="form-group"
      id="splitShareSection"
      style="display:none"
    >

      <label class="form-label">
        負担額
      </label>

      <div class="split-shares-row">

        <div class="split-share-item">
          <label class="form-label">👨 慶佑</label>

          <input
            class="form-input"
            id="entryShareKeisuke"
            type="number"
            placeholder="0"
          >
        </div>

        <div class="split-share-item">
          <label class="form-label">👩 寧子</label>

          <input
            class="form-input"
            id="entryShareNene"
            type="number"
            placeholder="0"
          >
        </div>

      </div>

    </div>
    <div class="form-group">
      <label class="form-label">タグ（任意、スペース区切り）</label>
      <input class="form-input" id="inputTags" type="text" placeholder="例：#友人 #外食">
    </div>
    <button class="save-btn" id="saveEntryBtn">保存する</button>
  </div>
</div>

<!-- ===== モーダル：割り勘入力 ===== -->
<div class="overlay" id="splitOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">割り勘・立替を記録</span>
      <button class="modal-close" id="splitOverlayClose">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">タイトル</label>
      <input class="form-input" id="splitTitle" type="text" placeholder="例：居酒屋 渋谷">
    </div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" id="splitDate" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">支払総額（円）</label>
      <input class="form-input amount-input" id="splitTotal" type="number" inputmode="decimal" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">実際に払った人</label>
      <div class="chip-grid-2" id="splitPaidByGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">各自の負担額（円）</label>
      <div class="split-shares-row">
        <div class="split-share-item">
          <label class="form-label" style="margin-bottom:6px">👨 慶佑</label>
          <input class="form-input" id="splitShareKeisuke" type="number" inputmode="decimal" placeholder="0">
        </div>
        <div class="split-share-item">
          <label class="form-label" style="margin-bottom:6px">👩 寧子</label>
          <input class="form-input" id="splitShareNene" type="number" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <div id="splitValidationMsg" class="validation-msg"></div>
    </div>
    <div class="form-group">
      <label class="form-label">メモ（任意）</label>
      <input class="form-input" id="splitNote" type="text" placeholder="自由記述">
    </div>
    <div class="form-group form-check-row">
      <input type="checkbox" id="splitCreateEntry" checked>
      <label for="splitCreateEntry" class="form-label" style="margin:0">明細にも記録する</label>
    </div>
    <button class="save-btn" id="saveSplitBtn">保存する</button>
  </div>
</div>

<!-- ===== モーダル：負債内訳 ===== -->
<div class="overlay" id="debtDetailOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="debtDetailTitle">内訳</span>
      <button class="modal-close" id="debtDetailClose">×</button>
    </div>
    <div id="debtDetailList" class="split-list"></div>
  </div>
</div>

<!-- ===== モーダル：サブスク追加 ===== -->
<div class="overlay" id="subOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">サブスクを追加</span>
      <button class="modal-close" id="subOverlayClose">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">サービス名</label>
      <input class="form-input" id="subName" type="text" placeholder="例：Netflix">
    </div>
    <div class="form-group">
      <label class="form-label">金額（円/月）</label>
      <input class="form-input amount-input" id="subAmount" type="number" inputmode="decimal" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">引き落とし日（毎月何日）</label>
      <input class="form-input" id="subBillingDay" type="number" min="1" max="31" placeholder="例：15">
    </div>
    <div class="form-group">
      <label class="form-label">カテゴリ</label>
      <div class="chip-grid" id="subCatGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">支払い方法</label>
      <div class="chip-grid-2" id="subPayGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">支払者</label>
      <div class="chip-grid-2" id="subPayerGrid"></div>
    </div>
    <button class="save-btn" id="saveSubBtn">保存する</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
